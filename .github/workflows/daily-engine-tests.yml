name: Daily engine tests

on:
  push:
    branches:
      - feature/v0.9.3-estrutura-corporativa
  pull_request:
    branches:
      - main

jobs:
  test-daily-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily engine unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
