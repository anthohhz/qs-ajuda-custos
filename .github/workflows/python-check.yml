name: Python check

on:
  push:
    branches:
      - feature/v0.9.3-estrutura-corporativa
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app

      - name: Import FastAPI application
        env:
          QS_SESSION_SECRET: ci-only-session-secret
          QS_AJUDA_DATA_DIR: /tmp/qs-ajuda-custos-ci
        run: python -c "import app.main; print(app.main.app.title)"
