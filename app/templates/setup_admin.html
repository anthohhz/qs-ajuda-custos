<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração inicial · QS</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-body">
<div class="auth-wrap"><div class="auth-brand"><div class="qs-mark big">QS</div><div><h1>Configuração inicial</h1><p>Crie o primeiro administrador</p></div></div>
<form class="auth-card" method="post" action="/setup-admin"><h2>Administrador</h2><p class="muted">Essa conta poderá criar usuários e configurar regras.</p>{% if request.query_params.get('erro') %}<div class="notice error-notice">Preencha todos os campos. A senha precisa ter pelo menos 8 caracteres.</div>{% endif %}<label>Nome<input name="display_name" required placeholder="Ex.: Anthony"></label><label>Usuário<input name="username" required placeholder="Ex.: anthony"></label><label>Senha<input type="password" name="password" minlength="8" required></label><button class="btn full" type="submit">Criar administrador e entrar</button></form></div></body></html>
